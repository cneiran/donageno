
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin DonaGeno</title>
</head>
<body>

<h2>Painel Admin</h2>

<input id="nome" placeholder="Produto">
<input id="preco" type="number" placeholder="Preço">
<input id="categoria" placeholder="Categoria">
<input type="file" id="imagem">
<button onclick="salvar()">Salvar</button>

<div id="produtos"></div>

<script type="module">
import { db, storage } from "./firebase.js";
import {
  collection, addDoc, getDocs, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

async function salvar(){
  const file = imagem.files[0];
  const imgRef = ref(storage, "produtos/" + file.name);
  await uploadBytes(imgRef, file);
  const url = await getDownloadURL(imgRef);

  await addDoc(collection(db, "produtos"), {
    nome: nome.value,
    preco: Number(preco.value),
    categoria: categoria.value,
    imagem: url
  });

  listar();
}

async function listar(){
  produtos.innerHTML = "";
  const q = await getDocs(collection(db, "produtos"));
  q.forEach(d => {
    const p = d.data();
    produtos.innerHTML += `
      <div>
        ${p.nome} - R$ ${p.preco}
        <button onclick="remover('${d.id}')">X</button>
      </div>
    `;
  });
}

async function remover(id){
  await deleteDoc(doc(db, "produtos", id));
  listar();
}

window.salvar = salvar;
window.remover = remover;
listar();
</script>

</body>
</html>
